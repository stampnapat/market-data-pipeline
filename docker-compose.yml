# Local data platform. Start with:  docker compose up -d
# Values like ${POSTGRES_USER} are read from the .env file next to this one.

# ---------------------------------------------------------------------------
# Shared settings for every Airflow container (YAML anchor, reused below)
# ---------------------------------------------------------------------------
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: market-data-airflow:local
  environment: &airflow-common-env
    # LocalExecutor runs tasks as subprocesses of the scheduler: no Celery/Redis
    # needed on a single machine.
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    # Workers report task state back through the api-server's Execution API
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — one server, separate databases:
  #   warehouse : our data (staging / intermediate / marts)
  #   airflow   : Airflow's own metadata (DAG runs, task states)
  #   metabase  : Metabase's own app data (added in the next step)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Extra variables consumed by infra/postgres/init.sh
      WAREHOUSE_DB: ${WAREHOUSE_DB}
      LOADER_USER: ${LOADER_USER}
      LOADER_PASSWORD: ${LOADER_PASSWORD}
      METABASE_READER_USER: ${METABASE_READER_USER}
      METABASE_READER_PASSWORD: ${METABASE_READER_PASSWORD}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts in this folder run ONCE, only when the data volume is empty
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${WAREHOUSE_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage for the raw (bronze) layer
  # Official minio/minio images were withdrawn from Docker Hub (Oct 2025).
  # Chainguard publishes a maintained free build (free tier = 'latest' only).
  # ---------------------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"  # S3 API (used by code)
      - "9001:9001"  # web console (used by humans)
    volumes:
      - minio_data:/data
    healthcheck:
      # Minimal image has no curl, so speak HTTP over bash's /dev/tcp
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r status <&3 && [[ "$$status" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot job: create the raw bucket, then exit.
  # The client image has no shell; MC_HOST_<alias> configures the connection.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    command: ["mb", "--ignore-existing", "local/${MINIO_BUCKET}"]

  # ---------------------------------------------------------------------------
  # Airflow — orchestration
  # ---------------------------------------------------------------------------
  # One-shot: create/upgrade Airflow's DB tables and the admin user, then exit.
  # The official image's entrypoint does both when these _AIRFLOW_* flags are set.
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    command: ["version"]
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}

  # Web UI + REST API + Execution API (tasks report their state here)
  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Decides WHAT should run WHEN, and (LocalExecutor) runs the tasks
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Parses Python files in dags/ into DAG definitions stored in the DB
  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
