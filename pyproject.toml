[project]
name = "market-data-ingestion"
version = "0.1.0"
description = "Ingestion code for the crypto + gold market data pipeline"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6.0",
    "pyarrow>=17",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pendulum>=3",  # Airflow passes pendulum datetimes; tests cover that case
    "ruff~=0.17.0",
]
dbt = [
    # Pinned to the same minor versions as the Airflow image (docker/airflow/Dockerfile)
    "dbt-core~=1.12.0",
    "dbt-postgres~=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dbt"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP pyupgrade, B bugbear, SIM simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ingestion", "pipeline_assets"]
