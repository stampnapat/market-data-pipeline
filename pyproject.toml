[project]
name = "market-data-ingestion"
version = "0.1.0"
description = "Ingestion code for the crypto + gold market data pipeline"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6.0",
    "pyarrow>=17",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pendulum>=3",  # Airflow passes pendulum datetimes; tests cover that case
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
