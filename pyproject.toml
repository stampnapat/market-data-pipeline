[project]
name = "market-data-ingestion"
version = "0.1.0"
description = "Ingestion code for the crypto + gold market data pipeline"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
