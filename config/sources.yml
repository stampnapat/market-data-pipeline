# One entry = one dataset to ingest.
# Adding a symbol or a new pipeline should only require editing this file.
sources:
  - name: binance_klines
    type: binance
    params:
      symbols: [BTCUSDT, ETHUSDT]
      interval: 1h

  - name: fx_rates
    type: frankfurter
    params:
      base: USD
      symbols: [THB]

  # Third-party JSON mirror of the Gold Traders Association's latest announcement
  # (the association's site has no public API). Latest only: no history.
  - name: thai_gold
    type: thai_gold
    params:
      url: https://api.chnwt.dev/thai-gold-api/latest
