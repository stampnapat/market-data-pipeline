# Connection settings. No secrets here: everything comes from environment variables
# (load .env first locally; Airflow containers already have them).
market_data:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      dbname: "{{ env_var('WAREHOUSE_DB') }}"
      user: "{{ env_var('LOADER_USER') }}"
      password: "{{ env_var('LOADER_PASSWORD') }}"
      schema: staging  # fallback only; every layer sets its own schema
      threads: 4
