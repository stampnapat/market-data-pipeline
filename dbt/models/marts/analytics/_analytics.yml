version: 2

models:
  - name: mart_moving_averages
    description: >
      7- and 30-observation simple moving averages of the daily close per asset,
      plus a simple trend label (7-day MA above 30-day MA = up). NULL until a window is full.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [asset_id, price_date]
    columns:
      - name: ma_7
        data_tests: [positive]
      - name: trend
        data_tests:
          - accepted_values:
              arguments:
                values: [up, down]

  - name: mart_daily_volatility
    description: >
      Daily close-to-close return, intraday range and 30-observation rolling volatility
      (std. dev. of log returns), also annualized (365 for crypto, 252 for FX/gold).
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [asset_id, price_date]
    columns:
      - name: intraday_range_pct
        data_tests:
          - expression_is_true:
              arguments:
                expression: "intraday_range_pct >= 0"
      - name: volatility_30_pct
        data_tests:
          - expression_is_true:
              arguments:
                expression: "volatility_30_pct >= 0"

  - name: mart_btc_gold_correlation
    description: >
      Rolling 30-observation correlation of daily log returns between BTC and spot gold,
      computed only on days both have a close. NULL until 30 common observations exist.
    columns:
      - name: price_date
        data_tests: [unique, not_null]
      - name: correlation_30
        data_tests:
          - expression_is_true:
              arguments:
                expression: "correlation_30 between -1 and 1"

  - name: mart_thai_gold_premium
    description: >
      Thai 96.5% gold bar dealer sell price vs. its spot value in THB
      (XAU USD/oz x USDTHB x 15.244 g x 0.965 / 31.1035 g/oz). Positive premium = Thai
      price above spot. Spot and FX are the latest values at most 4 days before the Thai date.
    columns:
      - name: price_date
        data_tests: [unique, not_null]
      - name: premium_pct
        data_tests:
          # A premium outside -5%..+10% is far more likely bad data than a real market
          - expression_is_true:
              arguments:
                expression: "premium_pct between -5 and 10"
              config:
                severity: warn
